# 隨機種子，無單位；出處：實作計畫 Task 1，固定種子用於重現。
seed: 0
# 液體物性設定，以下採 SI 單位；出處：設計文件第 3 節。
liquid:
  # 水的密度，kg/m³；出處：設計文件第 3 節預設物性。
  density_kg_m3: 998.0
  # 水的表面張力，N/m；出處：設計文件第 3 節預設物性。
  surface_tension_n_m: 0.072
  # 水的動力黏度，Pa·s；出處：設計文件第 3 節（1.0 mPa·s）。
  viscosity_pa_s: 0.001
# 空氣物性與阻力開關，以下採 SI 單位；出處：實作計畫 Task 1。
air:
  # 空氣密度，kg/m³；出處：實作計畫 Task 1 的 AirConfig 預設值。
  density_kg_m3: 1.204
  # 空氣動力黏度，Pa·s；出處：實作計畫 Task 1 的 AirConfig 預設值。
  viscosity_pa_s: 0.0000181
  # 是否計算空氣阻力，無單位；出處：設計文件第 5.1 節。
  drag_enabled: true
# 撞擊形狀規則：設計 §5.3；經驗近似，非實拍驗證結果。
impact:
  ruleset: literature_v1 # 規則組名稱，無單位；出處：設計 §5.3，可替換規則。
  spread_a: 1.24 # 攤開內插係數，無單位；Laan 2014，待核對原文。
  angle_bias_deg: 0.0 # 長寬比角度偏差，度；Joris 2017，待實拍校正，預設關閉。
  spine_a: 0.1443 # 毛刺冪次係數，無單位；Bhola & Chandra 1999／Mehdizadeh 2004，待核對原文。
  spine_b: 0.5 # We 指數，無單位；同上，待核對原文。
  spine_c: 0.25 # Re 指數，無單位；同上，待核對原文。
  spine_min_weber: 10.0 # 毛刺出現門檻，無單位；設計 §5.3，待實拍校正。
  spine_length_frac: [0.1, 0.35] # 相對寬度的毛刺長度範圍，無單位；待實拍校正。
  spine_front_kappa: 3.0 # 前緣集中參數，無單位；專題統整第十一節，待實拍校正。
  tail_coeff: 0.4 # 尾巴長度比例，無單位；設計 §5.3 定性近似，待實拍校正。
  satellite_min_weber: 150.0 # 衛星小滴門檻，無單位；設計 §5.3，待實拍校正。
  satellite_per_weber: 0.02 # 衛星數量斜率，無單位；設計 §5.3，待實拍校正。
  satellite_max: 8 # 衛星數量上限，滴；設計 §5.3，待實拍校正。
  satellite_size_frac: [0.03, 0.12] # 相對寬度的衛星直徑，無單位；待實拍校正。
  paper: coated # 紙種 coated 塗佈紙／copy 影印紙；設計 §5.3，待實拍校正。
  bleed_mm: {coated: 0.05, copy: 0.4} # 暈染寬度，mm；影像近似，待實拍校正。
  jitter_frac: 0.05 # 共用幾何尺度擾動比例，無單位；設計 §5.3，待實拍校正。
# 繪製外觀，出處：計畫 Task 3／設計 §5.4；非物理形狀參數。
render:
  paper_rgb: [245, 245, 240] # 紙色，RGB 0–255；設計預設。
  dye_rgb: [190, 30, 45] # 染料顏色，RGB 0–255；設計預設。
  dye_opacity: [0.6, 0.9] # 染料不透明度範圍，0–1；影像效果。
  draw_spines: true # 繪製毛刺，布林值；幾何來自 impact 規則。
  draw_tail: true # 繪製尾巴，布林值；幾何來自 impact 規則。
  draw_satellites: true # 繪製衛星，布林值；另存母滴編號遮罩。
# 影像干擾，出處：設計 §5.4；僅改影像，不改遮罩及答案。
augment:
  paper_texture: {enabled: true, strength: 6.0} # 紙紋開關／亮度標準差，0–255 灰階。
  lighting: {enabled: true, strength: 0.08} # 光線梯度開關／相對強度，無單位。
  blur: {enabled: true, sigma_px: [0.0, 1.2]} # 模糊開關／高斯標準差範圍，px。
  noise: {enabled: true, std: [1.0, 4.0]} # 亮度雜訊開關／標準差範圍，灰階。
  jpeg: {enabled: true, quality: [75, 95]} # 壓縮開關／品質範圍，1–100。
# 場景取樣，出處：設計 §5.2；範圍由專題實驗設計選定。
scene:
  mode: spray # spray 噴射／vertical_drop 垂直滴落／single 直接指定撞擊。
  diameter:
    mode: fixed # fixed 固定／log_uniform 對數均勻，無單位。
    fixed_mm: 3.0 # 固定液滴直徑，mm；對應滴管校正。
    range_mm: [0.3, 4.0] # 隨機直徑範圍，mm。
  spray:
    source_height_m: [0.1, 0.3] # 源頭離紙高度，m。
    source_offset_m: 0.3 # 紙中心兩側的源頭水平取樣範圍，m。
    cone_half_angle_deg: 30.0 # 指向紙中心的發射錐半角，度。
    launch_speed_m_s: [0.5, 5.0] # 發射速率範圍，m/s。
    drops_launched: [30, 80] # 每次發射滴數範圍，滴。
    min_drops_on_paper: 9 # 紙內有效滴數下限，滴；設計引用 Joris 2015。
    max_resample: 50 # 重抽上限，次；避免無限迴圈。
    min_impact_angle_deg: 10.0 # 撞擊角下限，度；拒絕過淺撞擊。
  vertical_drop:
    heights_m: [0.1, 0.2, 0.3] # 逐場景輪替高度，m。
    grid: [3, 4] # 紙內等分 x/y 格點數，個。
  single:
    speed_m_s: [0.5, 5.0] # 直接取樣撞擊速率，m/s。
    impact_angle_deg: [10.0, 90.0] # 直接取樣撞擊角，度。
# 輸出設定，出處：設計 §5.4–5.5／計畫 Task 4。
output:
  n_scenes: 100 # 場景數，張，至少 1。
  name: dataset # 資料集名稱，不含路徑。
  crop_size_px: 384 # 單滴切片邊長，px，不縮放不旋轉。
