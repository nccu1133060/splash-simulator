[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splash-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
splash-sim = "splash_sim.cli:main"

[dependency-groups]
dev = ["pytest"]
train = ["xgboost", "pandas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: 效能測試"]

[tool.setuptools.packages.find]
where = ["src"]
